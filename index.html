<!DOCTYPE html>
<html lang="en">
<head>

<title>KRAIIILEFX Scenepacks</title>
<meta name="description" content="Game, series and film scenepacks by KRAIIILEFX.">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Cpath d='M22 14V50M22 33L44 14M22 33L44 50' stroke='%23f0ede6' stroke-width='8' stroke-linecap='square' fill='none'/%3E%3C/svg%3E">

<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0ede6;
    --muted: #b5b5b5;
    --dim: #8b8882;
    --line: #1e1e1e;
    --pad: clamp(16px, 3vw, 32px);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--pad);
    padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: clamp(14px, 2vw, 24px);
  }
  .brand { min-width: 0; }
  h1 {
    font-family: "Unbounded", "Bebas Neue", sans-serif;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.04em;
    font-size: clamp(20px, 3vw, 34px);
    display: flex;
    flex-wrap: wrap;
    overflow: hidden;
    padding-bottom: .06em;
  }
  h1 span {
    display: inline-block;
    animation: letterIn 1s var(--ease) backwards, wave 6s ease-in-out infinite;
    animation-delay: calc(var(--i) * 60ms + 100ms), calc(var(--i) * 120ms + 2400ms);
  }
  @keyframes letterIn { from { transform: translateY(110%); } }
  @keyframes wave { 0%, 50%, 100% { opacity: 1; } 25% { opacity: .28; } }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

  .tag {
    margin-top: 8px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    animation: fade .9s var(--ease) backwards;
    animation-delay: .9s;
  }

  .socials { display: flex; gap: 8px; }
  .socials a {
    width: 40px; height: 40px;
    border: 1px solid #2a2a2a;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text);
    opacity: 0;
    transform: scale(.6);
    animation: pop .5s var(--ease) forwards;
    animation-delay: calc(.6s + var(--i) * 90ms);
    transition: background .25s, transform .25s var(--ease), border-color .25s;
  }
  .socials a:hover { background: #1f1f1f; border-color: #555; transform: translateY(-3px) scale(1.08); }
  .socials svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .socials svg.fill { fill: currentColor; stroke: none; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  .meta {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding: 14px 0 6px;
    color: var(--dim);
    font-size: 13px;
    animation: fade .9s var(--ease) backwards;
    animation-delay: 1s;
  }
  .meta b { font-weight: 500; color: var(--text); }

  /* ---------- Film şeridi ---------- */
  .strip {
    width: 100%;
    max-width: 1040px;
    margin: clamp(8px, 2vw, 20px) auto 0;
    display: grid;
    gap: clamp(14px, 2.2vw, 22px);
  }
  .fr {
    position: relative;
    display: block;
    background: #050505;
    padding: 22px 0;
    border-radius: 8px;
    animation: frIn 1s var(--ease) backwards;
    animation-delay: calc(1s + var(--i) * 180ms);
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes frIn { from { opacity: 0; transform: translateY(48px) scale(.97); } }
  /* film delikleri */
  .fr::before, .fr::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px;
    height: 8px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, #232323 0 12px, transparent 12px 26px);
  }
  .fr::before { top: 7px; }
  .fr::after { bottom: 7px; }

  .im {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    aspect-ratio: 21 / 9;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: clamp(14px, 2vw, 24px);
    background: #111;
  }
  /* fotoğraf */
  .im .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;   /* yüz kesiliyorsa: "center top" ya da "60% 30%" yap */
    z-index: -2;
    filter: brightness(.8);
    transform: scale(1.02);
    transition: transform 1.2s var(--ease), filter .4s;
    pointer-events: none;
  }
  .im .shade {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(5,5,5,0) 35%, rgba(5,5,5,.85) 100%);
    pointer-events: none;
  }
  /* fareyi takip eden ışık */
  .im::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 30%), rgba(240,237,230,.12), transparent 60%);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  .fr:hover .im::after { opacity: 1; }
  .fr:hover .bg { transform: scale(1.06); filter: brightness(1); }

  .tc {
    position: absolute;
    top: 12px; right: 16px;
    z-index: 1;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    letter-spacing: .05em;
  }
  .cap { position: relative; z-index: 1; transition: transform .5s var(--ease); }
  .fr:hover .cap { transform: translateX(10px); }
  .cap h2 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 5.5vw, 62px);
    line-height: .9;
  }
  .cap h2.logo-title { line-height: 0; }
  .cap h2.logo-title img {
    display: block;
    height: clamp(24px, 3.8vw, 46px);
    width: auto;
    max-width: 100%;
  }
  .cap p { color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* ---------- Animasyonlu ok ---------- */
  .arrow {
    position: relative;
    z-index: 1;
    flex: none;
    width: 38px; height: 38px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    overflow: hidden;
    transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease);
  }
  .arrow svg {
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .arrow .a1 { animation: nudge 1.8s ease-in-out infinite; }
  .arrow .a2 { transform: translateX(-32px); }
  @keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(3px); } }
  @keyframes outR  { from { transform: none; } to { transform: translateX(32px); } }
  @keyframes inR   { from { transform: translateX(-32px); } to { transform: none; } }
  .fr:hover .arrow { transform: scale(1.1); }
  .fr:hover .arrow .a1 { animation: outR 1s cubic-bezier(.65,0,.35,1) infinite; }
  .fr:hover .arrow .a2 { animation: inR 1s cubic-bezier(.65,0,.35,1) infinite; }
  /* Call of Duty: sarı — Jon Bernthal: beyaz */
  .fr.cod:hover .arrow { background: #ffd400; border-color: #ffd400; color: #0a0a0a; }
  .fr.jon:hover .arrow { background: #fff; border-color: #fff; color: #0a0a0a; }

  /* ---------- Alt satır ---------- */
  footer { margin-top: auto; padding-top: 28px; font-size: 12px; color: #6f6f6f; animation: fade 1s var(--ease) backwards; animation-delay: 1.6s; }
  footer a { transition: color .25s; }
  footer a:hover { color: #fff; }

  /* ---------- Mobil ---------- */
  @media (max-width: 640px) {
    .im { aspect-ratio: 16 / 10; }
    .tc { display: none; }
  }
  @media (hover: none) {
    .fr:hover .bg { transform: scale(1.02); filter: brightness(.8); }
    .fr:hover .cap { transform: none; }
    .fr:active { transform: scale(.985); }
    .fr.cod:active .arrow { background: #ffd400; border-color: #ffd400; color: #0a0a0a; }
    .fr.jon:active .arrow { background: #fff; border-color: #fff; color: #0a0a0a; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .socials a { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<script>
  // Fareyi takip eden ışık
  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  // Yıl
  document.getElementById('year').textContent = new Date().getFullYear();

  // Toplam sayacı (0'dan sayar)
  var total = 12;
  function countUp() {
    var el = document.getElementById('total');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = total; return; }
    var st = null;
    requestAnimationFrame(function f(ts) {
      st = st || ts;
      var p = Math.min((ts - st) / 1400, 1);
      el.textContent = Math.round(total * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(f);
    });
  }

  // Scenepack sayılarını data/scenepacks.json'dan otomatik güncelle
  fetch('data/scenepacks.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.querySelectorAll('[data-folder]').forEach(function (card) {
        var n = data.filter(function (p) { return p.folder === card.dataset.folder; }).length;
        if (n) {
          card.querySelector('.count').textContent = n + ' scenepack' + (n === 1 ? '' : 's');
          card.querySelector('.tc').textContent = '00:' + String(n).padStart(2, '0');
        }
      });
      if (data.length) total = data.length;
    })
    .catch(function () {})
    .then(function () { setTimeout(countUp, 1000); });
</script>

</body>
