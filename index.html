<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRAIIILEFX Scenepacks</title>
<meta name="description" content="Game, series and film scenepacks by KRAIIILEFX.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Cpath d='M22 14V50M22 33L44 14M22 33L44 50' stroke='%23f0ede6' stroke-width='8' stroke-linecap='square' fill='none'/%3E%3C/svg%3E">

<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0ede6;
    --muted: #b5b5b5;
    --gap: 12px;
    --pad: clamp(16px, 3vw, 32px);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--pad);
    padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: clamp(20px, 3vw, 36px);
  }
  h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    line-height: .85;
    letter-spacing: .01em;
    font-size: clamp(56px, 15vw, 190px);
    display: flex;
    flex-wrap: wrap;
  }
  h1 span {
    display: inline-block;
    opacity: 0;
    transform: translateY(40%) rotate(4deg);
    animation: letterIn .8s var(--ease) forwards;
    animation-delay: calc(var(--i) * 60ms);
  }
  @keyframes letterIn { to { opacity: 1; transform: none; } }

  .socials { display: flex; gap: 8px; }
  .socials a {
    width: 40px; height: 40px;
    border: 1px solid #2a2a2a;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text);
    text-decoration: none;
    opacity: 0;
    transform: scale(.6);
    animation: pop .5s var(--ease) forwards;
    animation-delay: calc(.6s + var(--i) * 90ms);
    transition: background .25s, transform .25s var(--ease), border-color .25s;
  }
  .socials a:hover { background: #1f1f1f; border-color: #555; transform: translateY(-3px) scale(1.08); }
  .socials svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .socials svg.fill { fill: currentColor; stroke: none; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  /* ---------- Kartlar ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gap);
  }
  .card {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    min-height: clamp(220px, 48vw, 540px);
    padding: clamp(16px, 2.5vw, 28px);
    border-radius: 20px;
    background: #111;
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(40px);
    animation: cardIn .9s var(--ease) forwards;
    animation-delay: calc(.5s + var(--i) * 150ms);
    transition: transform .4s var(--ease), box-shadow .4s;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  /* Fotoğraf arka plan */
  .card .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;   /* yüz kesiliyorsa: "center top" ya da "60% 30%" yap */
    z-index: -3;
    filter: brightness(.8);
    transform: scale(1.02);
    transition: transform 1.2s var(--ease), filter .4s;
    pointer-events: none;
  }
  .card .shade {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient(180deg, rgba(10,10,10,0) 35%, rgba(10,10,10,.88) 100%);
    pointer-events: none;
  }
  .card:hover .bg { transform: scale(1.07); filter: brightness(.95); }

  /* Fareyi takip eden ışık */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 30%), rgba(240,237,230,.12), transparent 60%);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  /* Geçen parlama */
  .card::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -60%;
    width: 40%;
    z-index: -1;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.08), transparent);
    transform: skewX(-15deg);
    transition: left .8s var(--ease);
    pointer-events: none;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  .card:hover::before { opacity: 1; }
  .card:hover::after { left: 120%; }

  .card h2 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(36px, 6vw, 80px);
    line-height: .95;
    transition: transform .4s var(--ease), letter-spacing .4s var(--ease);
  }
  .card:hover h2 { transform: translateX(8px); letter-spacing: .02em; }
  .card h2.logo-title { line-height: 0; }
  .card h2.logo-title img {
    display: block;
    height: clamp(26px, 4.2vw, 56px);
    width: auto;
    max-width: 100%;
  }
  .card p { color: var(--muted); font-size: 13px; margin-top: 6px; transition: transform .4s var(--ease); }
  .card:hover p { transform: translateX(8px); }

  .arrow {
    flex: none;
    width: 44px; height: 44px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(0,0,0,.45);
    overflow: hidden;
    transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease);
  }
  .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card:hover .arrow { background: var(--text); color: #0a0a0a; border-color: var(--text); transform: scale(1.1) rotate(-45deg); }

  /* ---------- Alt satır ---------- */
  footer { margin-top: auto; padding-top: 28px; font-size: 12px; color: #6f6f6f; }
  footer a { color: inherit; text-decoration: none; transition: color .25s; }
  footer a:hover { color: #fff; }

  /* ---------- Mobil ---------- */
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .card { min-height: 240px; border-radius: 16px; }
  }
  @media (hover: none) {
    .card:hover { transform: none; box-shadow: none; }
    .card:hover .bg { transform: scale(1.02); filter: brightness(.8); }
    .card:active { transform: scale(.98); }
    .card:active .arrow { background: var(--text); color: #0a0a0a; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    h1 span, .socials a, .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<script>
  // Fareyi takip eden ışık
  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  // Yıl
  document.getElementById('year').textContent = new Date().getFullYear();

  // Scenepack sayılarını data/scenepacks.json'dan otomatik güncelle
  fetch('data/scenepacks.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.querySelectorAll('[data-folder]').forEach(function (card) {
        var n = data.filter(function (p) { return p.folder === card.dataset.folder; }).length;
        if (n) card.querySelector('.count').textContent = n + ' scenepack' + (n === 1 ? '' : 's');
      });
    })
    .catch(function () {});
</script>
