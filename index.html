
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="KRAIILEFX Scenepacks — scenepacks, downloads and edits.">

  <title>KRAIILEFX — Scenepacks</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --text: #f5f5f5;
      --muted: #777;
      --line: #242424;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Scanline background */
    .background-effects {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.035),
          transparent 65%
        );
    }

    .background-effects::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.025) 4px,
        transparent 5px
      );
      opacity: 0.45;
      animation: scan 12s linear infinite;
    }

    /* Subtle noise texture */
    .background-effects::after {
      content: "";
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      animation: noiseShift 0.22s steps(2) infinite;
    }

    .topbar {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 28px 7%;
      border-bottom: 1px solid var(--line);
      animation: reveal 1.1s ease both;
    }

    .logo {
      display: inline-block;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 4px;
      transition: opacity 0.25s ease;
    }

    .logo:hover {
      opacity: 0.65;
    }

    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      padding: 90px 20px 80px;
      text-align: center;
    }

    .hero-content {
      animation: reveal 1.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .main h1 {
      font-size: clamp(38px, 8vw, 100px);
      font-weight: 900;
      letter-spacing: -0.065em;
      line-height: 0.98;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.035);
    }

    .scenepacks-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 42px;
      padding: 17px 25px;
      border: 1px solid #777;
      background: rgba(255, 255, 255, 0.015);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
    }

    .scenepacks-button span {
      display: inline-block;
      font-size: 16px;
      transition: transform 0.3s ease;
    }

    .scenepacks-button:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      transform: translateY(-2px);
    }

    .scenepacks-button:hover span {
      transform: translateX(5px);
    }

    .scenepacks-button:focus-visible,
    .social-links a:focus-visible,
    .logo:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 5px;
    }

    .socials {
      margin-top: 100px;
      animation: reveal 1.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .socials h2 {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 5px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }

    .social-links a {
      padding-bottom: 5px;
      border-bottom: 1px solid transparent;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 2px;
      transition:
        color 0.25s ease,
        border-color 0.25s ease;
    }

    .social-links a:hover {
      color: #fff;
      border-color: #fff;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 24px 15px;
      border-top: 1px solid var(--line);
      color: #555;
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
      animation: reveal 1.1s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scan {
      from {
        transform: translateY(-12px);
      }
      to {
        transform: translateY(12px);
      }
    }

    @keyframes noiseShift {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(1%, -1%);
      }
      50% {
        transform: translate(-1%, 1%);
      }
      75% {
        transform: translate(1%, 1%);
      }
      100% {
        transform: translate(-1%, -1%);
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 23px 6%;
      }

      .main {
        padding: 75px 18px 65px;
      }

      .main h1 {
        letter-spacing: -0.05em;
      }

      .scenepacks-button {
        margin-top: 34px;
      }

      .socials {
        margin-top: 75px;
      }

      .social-links {
        gap: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }

      .hero-content,
      .socials,
      .topbar,
      footer {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="background-effects" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo" href="./index.html">KRAIILEFX</a>
  </header>

  <main class="main">
    <div class="hero-content">
      <h1>KRAIILEFX<br>SCENEPACKS</h1>

      <a class="scenepacks-button" href="./scenepacks.html">
        SCENEPACKS
        <span aria-hidden="true">→</span>
      </a>
    </div>

    <section class="socials" aria-label="Social media links">
      <h2>SOCIALS</h2>

      <nav class="social-links" aria-label="Social media">
        <a
          href="https://www.instagram.com/kraiilefx/"
          target="_blank"
          rel="noopener noreferrer"
        >
          INSTAGRAM ↗
        </a>

        <a
          href="https://www.tiktok.com/@kraiiilefx?lang=tr-TR"
          target="_blank"
          rel="noopener noreferrer"
        >
          TIKTOK ↗
        </a>
      </nav>
    </section>
  </main>

  <footer>KRAIILEFX © 2026</footer>
</body>
</html>
