<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRAIIILEFX</title>
<meta name="description" content="Game, series and film scenepacks by KRAIIILEFX.">
<meta name="theme-color" content="#060608">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Cpath d='M22 14V50M22 33L44 14M22 33L44 50' stroke='%23f0ede6' stroke-width='8' stroke-linecap='square' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/home.css?v=1">
<script data-goatcounter="https://kraiiilefx.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="top">
  <a class="logo" href="index.html" aria-label="KRAIIILEFX home">KRAIIILEFX</a>
  <nav class="nav" aria-label="Main">
    <a href="index.html" aria-current="page">Home</a>
    <a href="scenepacks.html">Scenepacks</a>
    <a href="#socials">Socials</a>
  </nav>
</header>

<main class="bento">

  <!-- HERO -->
  <section class="tile hero" aria-labelledby="hero-title">
    <span class="kicker">Collections</span>
    <h1 id="hero-title">Scenepacks</h1>
    <div class="hero-row">
      <p>Don’t forget to give credit.</p>
      <a class="pill" href="scenepacks.html">Browse all <span class="arr" aria-hidden="true">→</span></a>
    </div>
  </section>

  <!-- KLASÖRLER (JS data/scenepacks.json'dan doldurur; içindekiler yedek) -->
  <div class="folders" id="folders">
    <a class="tile folder" href="scenepacks.html#/Jon%20Bernthal" style="--i:0">
      <span class="kicker">Folder 01</span>
      <h3>Jon Bernthal</h3>
      <span class="folder-foot"><small></small><span class="arrow" aria-hidden="true"><svg viewBox="0 0 40 12"><path d="M1 6h37M33 1l5 5-5 5"/></svg></span></span>
    </a>
    <a class="tile folder" href="scenepacks.html#/Call%20of%20Duty" style="--i:1">
      <span class="kicker">Folder 02</span>
      <h3>Call of Duty</h3>
      <span class="folder-foot"><small></small><span class="arrow" aria-hidden="true"><svg viewBox="0 0 40 12"><path d="M1 6h37M33 1l5 5-5 5"/></svg></span></span>
    </a>
  </div>

  <!-- LATEST -->
  <section class="tile latest" aria-labelledby="latest-title">
    <h2 class="kicker" id="latest-title">Latest</h2>
    <div class="latest-grid" id="latest">
      <div class="pack skel" style="--i:0"></div>
      <div class="pack skel" style="--i:1"></div>
      <div class="pack skel" style="--i:2"></div>
      <div class="pack skel" style="--i:3"></div>
    </div>
  </section>

  <!-- SOCIALS -->
  <section class="tile socials" id="socials" aria-labelledby="socials-title">
    <h2 class="kicker" id="socials-title">Socials</h2>
    <div class="pills">
      <a href="https://www.instagram.com/kraiiilefx/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.tiktok.com/@kraiiilefx?lang=tr-TR" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="https://guns.lol/kraiiilefx" target="_blank" rel="noopener noreferrer">guns.lol</a>
    </div>
    <p class="socials-note">
      Follow <a href="https://www.instagram.com/kraiiilefx/" target="_blank" rel="noopener noreferrer">@kraiiilefx</a>
      on Instagram to get the download password.
    </p>
  </section>

</main>

<footer class="foot">
  <span>KRAIIILEFX © <span id="year">2026</span></span>
  <a href="legal.html">Legal / DMCA</a>
</footer>

<script>
(function () {
  "use strict";

  var DATA_URL = "data/scenepacks.json";
  var ARROW = '<span class="arrow" aria-hidden="true"><svg viewBox="0 0 40 12"><path d="M1 6h37M33 1l5 5-5 5"/></svg></span>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function hasLinks(p) {
    var L = p.links || {};
    return !!(L["1080p"] || L["2k"] || L["4k"] || p.mega);
  }
  /* scenepacks.js'in hash yönlendirmesi: #/Klasör/Altklasör/... */
  function href(parts) {
    return "scenepacks.html#/" + parts.filter(Boolean).map(encodeURIComponent).join("/");
  }
  function imgTag(src, pos) {
    if (!src) return "";
    return '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async"' +
      (pos ? ' style="object-position:' + esc(pos) + '"' : "") +
      ' onerror="this.remove()">';
  }

  /* ---------- klasörler (JSON'daki ilk görünme sırası) ---------- */
  function groupFolders(list) {
    var map = {}, out = [];
    list.forEach(function (p) {
      if (!p.folder) return;
      if (!map[p.folder]) { map[p.folder] = { name: p.folder, packs: [] }; out.push(map[p.folder]); }
      map[p.folder].packs.push(p);
    });
    out.forEach(function (f) {
      var c = f.packs.filter(function (p) { return p.folderCover; })[0];
      var any = f.packs.filter(function (p) { return p.cover; })[0];
      f.cover = c ? c.folderCover : (any ? any.cover : "");
      f.pos = c ? "" : (any ? any.coverPos : "");
    });
    return out;
  }

  function renderFolders(list) {
    var host = document.getElementById("folders");
    var groups = groupFolders(list);
    if (!groups.length) return;
    host.innerHTML = groups.map(function (f, i) {
      var n = f.packs.length;
      return '<a class="tile folder" href="' + href([f.name]) + '" style="--i:' + i + '">' +
        '<span class="folder-bg">' + imgTag(f.cover, f.pos) + '</span>' +
        '<span class="kicker">Folder ' + pad(i + 1) + '</span>' +
        '<h3>' + esc(f.name) + '</h3>' +
        '<span class="folder-foot"><small>' + n + ' scenepack' + (n === 1 ? "" : "s") + '</small>' + ARROW + '</span>' +
        '</a>';
    }).join("");
  }

  /* ---------- latest: indirilebilir en yeni 4 pack ---------- */
  function renderLatest(list) {
    var host = document.getElementById("latest");
    var items = list.map(function (p, i) { p._o = i; return p; })
      .filter(function (p) { return !p.locked && hasLinks(p); })
      .sort(function (a, b) {
        var d = (b.date || "").localeCompare(a.date || "");
        return d !== 0 ? d : b._o - a._o;
      })
      .slice(0, 4);

    if (!items.length) {
      host.innerHTML = '<p class="latest-empty">No scenepacks yet.</p>';
      return;
    }
    host.innerHTML = items.map(function (p, i) {
      return '<a class="pack" href="' + href([p.folder, p.subfolder, p.subfolder2]) + '" style="--i:' + i + '">' +
        imgTag(p.cover, p.coverPos) +
        '<span class="pack-info"><b>' + esc(p.character || p.name) + '</b>' +
        (p.production ? '<small>' + esc(p.production) + '</small>' : "") + '</span></a>';
    }).join("");
  }

  document.getElementById("year").textContent = new Date().getFullYear();

  fetch(DATA_URL + "?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var list = Array.isArray(data) ? data : [];
      renderFolders(list);
      renderLatest(list);
    })
    .catch(function () {
      document.getElementById("latest").innerHTML =
        '<p class="latest-empty">Could not load the latest scenepacks. <a href="scenepacks.html" style="text-decoration:underline">Browse all</a></p>';
    });
})();
</script>
</body>
</html>
