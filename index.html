<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>KRAIIILEFX</title>
  <meta name="description" content="KRAIIILEFX — game, series and film scenepacks.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #efece6;
      --dim: rgba(239, 236, 230, .6);
      --line: rgba(239, 236, 230, .18);
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --text: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        max(18px, env(safe-area-inset-top, 0px))
        max(18px, env(safe-area-inset-right, 0px))
        max(18px, env(safe-area-inset-bottom, 0px))
        max(18px, env(safe-area-inset-left, 0px));
      gap: 18px;
    }

    /* ---------- üst: isim + ikonlar ---------- */
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(3.2rem, 17vw, 9.5rem);
      line-height: .84;
      letter-spacing: -.005em;
      text-transform: uppercase;
    }

    .social {
      display: flex;
      gap: 8px;
      padding-top: 6px;
      flex-shrink: 0;
    }
    .social a {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--dim);
      transition: color .2s, border-color .2s, background .2s;
    }
    .social a:hover { color: var(--bg); background: var(--ink); border-color: var(--ink); }
    .social svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .social svg .fill { fill: currentColor; stroke: none; }
    .social img { width: 18px; height: 18px; object-fit: contain; filter: brightness(0) invert(1); opacity: .6; transition: opacity .2s, filter .2s; }
    .social a:hover img { filter: brightness(0); opacity: 1; }
    .social .logo-fallback { display: none; }
    .social a.no-logo img { display: none; }
    .social a.no-logo .logo-fallback { display: block; }

    .tagline {
      max-width: 34ch;
      font-size: clamp(.95rem, 3.6vw, 1.15rem);
      line-height: 1.5;
      color: var(--dim);
    }

    /* ---------- paneller ---------- */
    .panels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .panel {
      position: relative;
      flex: 1 1 0;
      min-height: 210px;
      border-radius: 14px;
      overflow: hidden;
      isolation: isolate;
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      background: #151515;
      -webkit-tap-highlight-color: transparent;
      transition: flex-grow .6s cubic-bezier(.2, .7, .2, 1);
    }
    .panel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transform: scale(1.02);
      transition: transform 1s cubic-bezier(.2, .7, .2, 1), filter .5s;
      filter: grayscale(.35) brightness(.78);
    }
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(to top, rgba(0, 0, 0, .85), rgba(0, 0, 0, 0) 62%);
    }

    .panel-name {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2rem, 9vw, 3.4rem);
      line-height: .95;
      text-transform: uppercase;
    }
    .panel-meta {
      display: block;
      margin-top: 8px;
      font: 500 .85rem/1 var(--text);
      color: var(--dim);
    }

    .panel-go {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(10, 10, 10, .35);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: background .3s, color .3s, transform .4s cubic-bezier(.2, .7, .2, 1);
    }
    .panel-go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .panel:active .panel-go { transform: scale(.92); }
    .panel:focus-visible, .social a:focus-visible, .all:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    @media (hover: hover) {
      .panel:hover img { transform: scale(1.08); filter: grayscale(0) brightness(.95); }
      .panel:hover .panel-go { background: var(--ink); color: var(--bg); transform: rotate(-45deg); }
    }

    /* ---------- alt ---------- */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 2px;
    }
    .all {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font: 600 .95rem/1 var(--text);
      text-decoration: none;
      transition: transform .2s, opacity .2s;
    }
    .all:hover { opacity: .88; }
    .all:active { transform: scale(.97); }
    .soon { font-size: .85rem; color: var(--dim); text-align: right; }

    /* ---------- geniş ekran: yan yana, hover'da açılan paneller ---------- */
    @media (min-width: 820px) {
      .page { gap: 26px; padding-left: 32px; padding-right: 32px; }
      .top { align-items: flex-end; }
      .brand { font-size: clamp(6rem, 13vw, 11rem); }
      .panels { flex-direction: row; gap: 12px; }
      .panel { min-height: 340px; padding: 26px; border-radius: 18px; }
      .panel:hover { flex-grow: 1.45; }
      .panel-name { font-size: clamp(2.6rem, 5vw, 4.4rem); }
    }

    @media (max-height: 520px) and (orientation: landscape) and (max-width: 819px) {
      .panels { flex-direction: row; }
      .panel { min-height: 160px; }
    }

    /* ---------- tek açılış: panellerin perdesi ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: reveal 1.1s cubic-bezier(.7, 0, .2, 1) both; }
      .panel:nth-child(2) { animation-delay: .15s; }
      .brand { animation: fade .9s ease both; }
    }
    @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1 class="brand">KRAIIILEFX</h1>
      <div class="social">
        <a href="https://www.instagram.com/kraiiilefx/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="fill" cx="17.3" cy="6.7" r="1.1"/></svg>
        </a>
        <a href="https://www.tiktok.com/@kraiiilefx?lang=tr-TR" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <svg viewBox="0 0 24 24"><path d="M14 3v11.2a3.8 3.8 0 1 1-3.8-3.8"/><path d="M14 3c.3 2.4 1.9 4.2 4.5 4.5"/></svg>
        </a>
        <a href="https://guns.lol/kraiiilefx" target="_blank" rel="noopener noreferrer" aria-label="guns.lol">
          <img src="assets/icons/gunslol.png" alt="" onerror="this.parentNode.classList.add('no-logo')">
          <svg class="logo-fallback" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        </a>
      </div>
    </header>

    <p class="tagline">Game, series and film scenepacks. Pick a folder and jump in.</p>

    <nav class="panels" aria-label="Scenepack folders">
      <a class="panel" href="scenepacks.html#/Call%20of%20Duty">
        <img src="assets/covers/call-of-duty.gif" alt="" decoding="async">
        <span>
          <span class="panel-name">Call of Duty</span>
          <span class="panel-meta">3 scenepacks</span>
        </span>
        <span class="panel-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>

      <a class="panel" href="scenepacks.html#/Jon%20Bernthal">
        <img src="assets/covers/jon-bernthal.gif" alt="" decoding="async">
        <span>
          <span class="panel-name">Jon Bernthal</span>
          <span class="panel-meta">9 scenepacks</span>
        </span>
        <span class="panel-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </nav>

    <footer class="bottom">
      <a class="all" href="scenepacks.html">All scenepacks</a>
      <span class="soon">More coming soon.</span>
    </footer>
  </main>
</body>
</html>
