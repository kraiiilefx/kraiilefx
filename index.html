
<script>
  const grid = document.getElementById("packGrid");

  async function loadScenepacks() {
    try {
      const response = await fetch("./data/scenepacks.json?update=" + Date.now());

      if (!response.ok) {
        throw new Error("JSON could not be loaded: " + response.status);
      }

      const data = await response.json();
      const packs = Array.isArray(data)
        ? data
        : (data.scenepacks || data.packs || []);

      if (packs.length === 0) {
        grid.innerHTML =
          '<p class="empty-message">No scenepacks available yet.</p>';
        return;
      }

      grid.innerHTML = "";

      packs.forEach((pack) => {
        const card = document.createElement("a");
        card.className = "pack-card";
        card.href =
          "./kraiiilefxscenepack.html?id=" +
          encodeURIComponent(pack.id || "");

        const cover = document.createElement("div");
        cover.className = "cover";

        if (pack.cover) {
          const img = document.createElement("img");

          img.src = "./" + pack.cover.replace(/^\.?\//, "");
          img.alt = (pack.name || pack.title || pack.production || "Scenepack") + " cover";
          img.loading = "lazy";

          img.onerror = () => {
            cover.innerHTML =
              '<div class="cover-placeholder">KRAIILEFX</div>';
          };

          cover.appendChild(img);
        } else {
          cover.innerHTML =
            '<div class="cover-placeholder">KRAIILEFX</div>';
        }

        const info = document.createElement("div");
        info.className = "pack-info";

        const title = document.createElement("div");
        title.className = "pack-title";
        title.textContent =
          pack.name || pack.title || pack.production || "Untitled Scenepack";

        const meta = document.createElement("div");
        meta.className = "pack-meta";
        meta.textContent = pack.character || pack.production || "SCENEPACK";

        info.appendChild(title);
        info.appendChild(meta);
        card.appendChild(cover);
        card.appendChild(info);
        grid.appendChild(card);
      });
    } catch (error) {
      grid.innerHTML =
        '<p class="empty-message">Could not load scenepacks. Please check data/scenepacks.json.</p>';
      console.error("Scenepack loading error:", error);
    }
  }

  loadScenepacks();
</script>
