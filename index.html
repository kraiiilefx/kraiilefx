<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRAIIILEFX Scenepacks</title>
<meta name="description" content="Game, series and film scenepacks by KRAIIILEFX.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Cpath d='M22 14V50M22 33L44 14M22 33L44 50' stroke='%23f0ede6' stroke-width='8' stroke-linecap='square' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Unbounded:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script data-goatcounter="https://kraiiilefx.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0ede6;
    --muted: #8b8882;
    --line: #2a2a2a;
    --pad: clamp(18px, 3vw, 32px);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--pad);
    padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    max-width: 1040px;
    width: 100%;
    margin: 0 auto clamp(40px, 8vw, 72px);
  }
  h1 {
    font-family: "Unbounded", "Bebas Neue", sans-serif;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.06em;
    font-size: clamp(20px, 3vw, 30px);
    display: flex;
    flex-wrap: wrap;
    overflow: hidden;
    padding-bottom: .06em;
  }
  h1 span {
    display: inline-block;
    animation: letterIn 1s var(--ease) backwards;
    animation-delay: calc(var(--i) * 60ms + 100ms);
  }
  @keyframes letterIn { from { transform: translateY(110%); } }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } }

  .socials { display: flex; gap: 8px; }
  .socials a {
    width: 40px; height: 40px;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(.6);
    animation: pop .5s var(--ease) forwards;
    animation-delay: calc(.5s + var(--i) * 90ms);
    transition: background .25s, transform .25s var(--ease), border-color .25s;
  }
  .socials a:hover { background: #1f1f1f; border-color: #555; transform: translateY(-3px) scale(1.08); }
  .socials svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .socials svg.fill { fill: currentColor; stroke: none; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  /* ---------- Sergi (plates) ---------- */
  .gallery {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    gap: clamp(36px, 7vw, 72px);
  }
  .plate {
    display: block;
    animation: fade 1s var(--ease) backwards;
    animation-delay: calc(.7s + var(--i) * 180ms);
    -webkit-tap-highlight-color: transparent;
  }
  .frame {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: clamp(10px, 1.6vw, 16px);
    transition: border-color .4s;
  }
  .photo {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    aspect-ratio: 21 / 9;
    background: #111;
  }
  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;   /* yüz kesiliyorsa: "center top" ya da "60% 30%" yap */
    filter: brightness(.85);
    transform: scale(1.02);
    transition: transform 1.2s var(--ease), filter .4s;
  }
  .plate:hover .frame { border-color: #5a5a5a; }
  .plate:hover .photo img { transform: scale(1.07); filter: brightness(1); }

  .info {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-top: clamp(18px, 3vw, 28px);
  }
  .label {
    color: var(--muted);
    font-size: clamp(11px, 1.5vw, 13px);
    letter-spacing: .28em;
    text-transform: uppercase;
  }
  .info h2 {
    margin-top: 6px;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(44px, 9vw, 76px);
    line-height: .95;
    transition: transform .5s var(--ease);
  }
  .plate:hover h2 { transform: translateX(10px); }

  .arrow {
    flex: none;
    width: 38px; height: 38px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    display: grid; place-items: center;
    margin-bottom: 8px;
    transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease);
  }
  .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .plate:hover .arrow { background: var(--text); border-color: var(--text); color: #0a0a0a; transform: scale(1.1); }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1040px; width: 100%; margin: auto auto 0;
    padding-top: 48px; font-size: 12px; color: #6f6f6f;
    animation: fade 1s var(--ease) backwards; animation-delay: 1.6s;
  }
  footer a { transition: color .25s; }
  footer a:hover { color: #fff; }

  @media (hover: none) {
    .plate:hover .photo img { transform: scale(1.02); filter: brightness(.85); }
    .plate:hover h2 { transform: none; }
    .plate:hover .frame { border-color: var(--line); }
    .plate:active .arrow { background: var(--text); color: #0a0a0a; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .socials a { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1 aria-label="KRAIIILEFX">

  </h1>
  <nav class="socials" aria-label="Socials">
    <a href="https://www.instagram.com/kraiiilefx/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="--i:0">

  </nav>
</header>

<main class="gallery">
  <a class="plate card" href="scenepacks.html#/Call%20of%20Duty" data-folder="Call of Duty" data-plate="01" style="--i:0">
    <div class="frame"><div class="photo">
      <img src="assets/covers/call-of-duty.jpg" alt="Call of Duty" decoding="async">
    </div></div>
    <div class="info">
      <div>
        <div class="label">Plate 01 &middot; <span class="count">3 scenepacks</span></div>

  <a class="plate card" href="scenepacks.html#/Jon%20Bernthal" data-folder="Jon Bernthal" data-plate="02" style="--i:1">
    <div class="frame"><div class="photo">
      <img src="assets/covers/jon-bernthal.jpg" alt="Jon Bernthal" decoding="async">
    </div></div>
    <div class="info">
      <div>
        <div class="label">Plate 02 &middot; <span class="count">9 scenepacks</span></div>

</main>

<footer>
  KRAIIILEFX &copy; <span id="year">2026</span> &nbsp;&middot;&nbsp; <a href="legal.html">Legal / DMCA</a>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Scenepack sayılarını data/scenepacks.json'dan otomatik güncelle
  fetch('data/scenepacks.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.querySelectorAll('[data-folder]').forEach(function (card) {
        var n = data.filter(function (p) { return p.folder === card.dataset.folder; }).length;
        if (n) card.querySelector('.count').textContent = n + ' scenepack' + (n === 1 ? '' : 's');
      });
    })
    .catch(function () {});
</script>

</body>
</html>
