
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>KRAIILEFX — Scenepacks</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      width: 100%;
      padding: 28px 7%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .main {
      flex: 1;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 80px;
    }

    .main h1 {
      font-size: clamp(38px, 8vw, 100px);
      font-weight: 900;
      letter-spacing: -0.065em;
      line-height: 0.98;
      text-transform: uppercase;
    }

    .scenepacks-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 42px;
      padding: 17px 25px;
      border: 1px solid #f5f5f5;
      color: #f5f5f5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      transition: background 0.2s, color 0.2s;
    }

    .scenepacks-button:hover {
      background: #f5f5f5;
      color: #080808;
    }

    .scenepacks-button span {
      font-size: 16px;
      transition: transform 0.2s;
    }

    .scenepacks-button:hover span {
      transform: translateX(4px);
    }

    .socials {
      margin-top: 100px;
    }

    .socials h2 {
      margin-bottom: 22px;
      color: #777;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 5px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .social-links a {
      padding-bottom: 5px;
      border-bottom: 1px solid transparent;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .social-links a:hover {
      color: #fff;
      border-color: #fff;
    }

    footer {
      padding: 24px 15px;
      border-top: 1px solid #222;
      color: #555;
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 23px 6%;
      }

      .main {
        padding-top: 80px;
      }

      .main h1 {
        letter-spacing: -0.05em;
      }

      .socials {
        margin-top: 80px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="./index.html">KRAIILEFX</a>
  </header>

  <main class="main">
    <h1>KRAIILEFX<br>SCENEPACKS</h1>

    <a class="scenepacks-button" href="./scenepacks.html">
      SCENEPACKS
      <span>→</span>
    </a>

    <section class="socials">
      <h2>SOCIALS</h2>

      <nav class="social-links" aria-label="Social media">
        <a
          href="https://www.instagram.com/kraiiilefx/"
          target="_blank"
          rel="noopener noreferrer"
        >
          INSTAGRAM ↗
        </a>

        <a
          href="https://www.tiktok.com/@kraiiilefx?lang=tr-TR"
          target="_blank"
          rel="noopener noreferrer"
        >
          TIKTOK ↗
        </a>
      </nav>
    </section>
  </main>

  <footer>
    KRAIILEFX © 2026
  </footer>
</body>
</html>
