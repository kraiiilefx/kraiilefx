<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRAIIILEFX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0ede6;
    --muted: #b5b5b5;
    --gap: 12px;
    --pad: clamp(16px, 3vw, 32px);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--pad);
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: clamp(20px, 3vw, 36px);
  }

  h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    line-height: .85;
    letter-spacing: .01em;
    font-size: clamp(56px, 15vw, 190px);
    display: flex;
    flex-wrap: wrap;
  }
  h1 span {
    display: inline-block;
    opacity: 0;
    transform: translateY(40%) rotate(4deg);
    animation: letterIn .8s var(--ease) forwards;
    animation-delay: calc(var(--i) * 60ms);
  }
  @keyframes letterIn { to { opacity: 1; transform: none; } }

  .socials { display: flex; gap: 8px; }
  .socials a {
    width: 40px; height: 40px;
    border: 1px solid #2a2a2a;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text);
    text-decoration: none;
    opacity: 0;
    transform: scale(.6);
    animation: pop .5s var(--ease) forwards;
    animation-delay: calc(.6s + var(--i) * 90ms);
    transition: background .25s, transform .25s var(--ease), border-color .25s;
  }
  .socials a:hover { background: #1f1f1f; border-color: #555; transform: translateY(-3px) scale(1.08); }
  .socials svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  /* ---------- Kartlar ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gap);
  }
  .card {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    min-height: clamp(220px, 48vw, 540px);
    padding: clamp(16px, 2.5vw, 28px);
    border-radius: 20px;
    background: #111;
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    opacity: 0;
    transform: translateY(40px);
    animation: cardIn .9s var(--ease) forwards;
    animation-delay: calc(.5s + var(--i) * 150ms);
    transition: transform .4s var(--ease), box-shadow .4s;
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  /* GIF arka plan */
  .card .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
    filter: brightness(.75);
    transform: scale(1.02);
    transition: transform .8s var(--ease), filter .4s;
  }
  /* Yazılar okunsun diye alttan karartma */
  .card .shade {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient(180deg, rgba(10,10,10,0) 35%, rgba(10,10,10,.88) 100%);
  }
  .card:hover .bg { transform: scale(1.08); filter: brightness(.95); }

  /* Fareyi takip eden ışık */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 30%), rgba(240,237,230,.12), transparent 60%);
    opacity: 0;
    transition: opacity .4s;
  }
  /* Geçen parlama */
  .card::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -60%;
    width: 40%;
    z-index: -1;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.08), transparent);
    transform: skewX(-15deg);
    transition: left .8s var(--ease);
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  .card:hover::before { opacity: 1; }
  .card:hover::after { left: 120%; }

  .card h2 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(36px, 6vw, 80px);
    line-height: .95;
    transition: transform .4s var(--ease), letter-spacing .4s var(--ease);
  }
  .card:hover h2 { transform: translateX(8px); letter-spacing: .02em; }
  .card p { color: var(--muted); font-size: 13px; margin-top: 6px; transition: transform .4s var(--ease); }
  .card:hover p { transform: translateX(8px); }

  .arrow {
    flex: none;
    width: 44px; height: 44px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(0,0,0,.45);
    overflow: hidden;
    transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease);
  }
  .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card:hover .arrow { background: var(--text); color: #0a0a0a; border-color: var(--text); transform: scale(1.1) rotate(-45deg); }

  /* ---------- Mobil ---------- */
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .card { min-height: 240px; border-radius: 16px; }
  }
  @media (hover: none) {
    .card:hover { transform: none; box-shadow: none; }
    .card:hover .bg { transform: scale(1.02); filter: brightness(.75); }
    .card:active { transform: scale(.98); }
    .card:active .arrow { background: var(--text); color: #0a0a0a; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    h1 span, .socials a, .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1 aria-label="KRAIIILEFX">
    <span style="--i:0">K</span><span style="--i:1">R</span><span style="--i:2">A</span><span style="--i:3">I</span><span style="--i:4">I</span><span style="--i:5">I</span><span style="--i:6">L</span><span style="--i:7">E</span><span style="--i:8">F</span><span style="--i:9">X</span>
  </h1>
  <nav class="socials" aria-label="Sosyal medya">
    <a href="#" aria-label="Instagram" style="--i:0">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5"/></svg>
    </a>
    <a href="#" aria-label="TikTok" style="--i:1">
      <svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.4 1.9 4 4.5 4.2"/></svg>
    </a>
    <a href="#" aria-label="Link" style="--i:2">
      <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </a>
  </nav>
</header>

<main class="grid">
  <a class="card" href="#" style="--i:0">
    <img class="bg" src="gifs/call-of-duty.gif" alt="" loading="lazy">
    <span class="shade"></span>
    <div>
      <h2>Call of Duty</h2>
      <p>3 scenepacks</p>
    </div>
    <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

  <a class="card" href="#" style="--i:1">
    <img class="bg" src="gifs/jon-bernthal.gif" alt="" loading="lazy">
    <span class="shade"></span>
    <div>
      <h2>Jon Bernthal</h2>
      <p>9 scenepacks</p>
    </div>
    <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>
</main>

<script>
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
</script>

</body>
</html>
