<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRAIIILEFX</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500&family=Unbounded:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--fg:#ffffff;--mute:#7a7a7e;--line:#2e2e30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fafaf8;--fg:#0d0d0d;--mute:#85858a;--line:#dcdcd9;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;font-weight:300;display:flex;flex-direction:column;text-align:center}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 32px;font-size:14px}
header .m{font-family:'Unbounded','Manrope',sans-serif;font-weight:300;letter-spacing:.2em;font-size:12px}
header a{color:var(--mute);text-decoration:none;margin-left:24px}
header a:hover,header a.on{color:var(--fg)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.stage{width:min(860px,94vw)}
h1{margin:0;font-family:'Unbounded','Manrope',system-ui,sans-serif;font-weight:200;font-size:clamp(28px,8.2vw,92px);letter-spacing:.05em;line-height:1.1;color:var(--fg);white-space:nowrap}
.tag{margin:28px 0 0;font-size:18px;color:var(--mute)}
.btn{display:inline-block;margin-top:26px;padding:13px 28px;border:1px solid var(--mute);border-radius:999px;background:none;color:var(--fg);font:inherit;font-weight:500;font-size:14px;letter-spacing:.06em;cursor:pointer;transition:background .2s,color .2s}
@media (hover:hover){.btn{cursor:default}}
.btn:hover,.btn:focus-visible{background:var(--fg);color:var(--bg)}
.tray{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,.7,.2,1)}
.tray>div{overflow:hidden;min-height:0}
.stage:hover .tray,.stage:focus-within .tray,.stage.open .tray{grid-template-rows:1fr}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(420px,100%);margin:0 auto;padding-top:30px;opacity:0;transition:opacity .4s .1s}
.stage:hover .cards,.stage:focus-within .cards,.stage.open .cards{opacity:1}
.card{aspect-ratio:4/5;background:none;border:1px solid var(--line);padding:0;cursor:pointer;position:relative;overflow:hidden;transition:border-color .25s}
.card{display:block;color:#fff;text-decoration:none;text-align:left}
.card i{position:absolute;inset:0;opacity:1}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card:hover,.card:focus-visible{border-color:var(--fg)}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(to top,rgba(0,0,0,.78),transparent);display:flex;flex-direction:column;gap:3px}
.card .lb b{font-weight:500;font-size:13px;letter-spacing:.04em}
.card .lb small{font-size:11px;opacity:.7;letter-spacing:.06em}
.card .lk{position:absolute;top:12px;right:12px;width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.card.locked{cursor:default}
.card.locked img{filter:grayscale(.6) brightness(.6)}
@media (hover:none){.card i{opacity:1}}
/* kart animasyonlari */
.card{opacity:0;translate:0 22px;scale:1;box-shadow:0 0 0 rgba(0,0,0,0);
  transition:opacity .55s calc(.15s + var(--i,0)*.12s) ease,translate .7s calc(.15s + var(--i,0)*.12s) cubic-bezier(.2,.8,.2,1),scale .45s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .45s}
.stage:hover .card,.stage:focus-within .card,.stage.open .card{opacity:1;translate:0 0}
.card:hover,.card:focus-visible{scale:1.04;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.card img{transform:scale(1.04);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.card:hover img,.card:focus-visible img{transform:scale(1.12)}
.card .lb{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .lb,.card:focus-visible .lb{transform:translateY(-4px)}
/* surekli yumusak yuzme + hover'da isik cizgisi */
@keyframes kx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{animation:kx-float 5s ease-in-out calc(var(--i,0)*-1.6s) infinite}
.card:hover,.card:focus-visible{animation-play-state:paused}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card:hover::after,.card:focus-visible::after{transform:translateX(120%);transition:transform .9s ease}
@media (prefers-reduced-motion:reduce){.card{opacity:1;translate:none;animation:none}.card img,.card .lb{transform:none}.card::after{display:none}}

.soc{display:flex;gap:12px;justify-content:center;margin-top:34px}
.soc a{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:color .2s,border-color .2s}
.soc a:hover{color:var(--fg);border-color:var(--mute)}
.soc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{padding:24px 32px 32px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:inherit;text-decoration:none;margin-left:16px}
footer a:hover{color:var(--fg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
@media (max-width:640px){header{padding:20px}footer{padding:20px;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="m">KRAIIILEFX</span></header>

<main>
<div class="stage" id="stage">
<h1>KRAIIILEFX</h1>
<p class="tag">More game, series and film scenepacks are coming.</p>
<button class="btn" id="btn">Explore scenepacks</button>
<div class="tray"><div><div class="cards" id="cards"></div></div></div>
<div class="soc">
  <a href="https://www.instagram.com/kraiiilefx/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg></a>
  <a href="https://www.tiktok.com/@kraiiilefx?lang=tr-TR" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 3.9 4.5 4.1"/></svg></a>
  <a href="https://github.com/kraiiilefx" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></a>
</div>
</div>
</main>

<footer><span>KRAIIILEFX © 2026</span><span><a href="#">Legal</a><a href="#">DMCA</a></span></footer>
<script>
/* Her kare bir scenepack önizlemesi. Düzenlemek için sadece bu listeyi değiştir.
   img: önizleme görseli yolu (boş bırakırsan renkli gradient görünür)
   href: tıklayınca açılacak sayfa
   locked: true ise kilit ikonu gösterir ("Coming soon") */
const packs=[
  {title:'Call of Duty',sub:'3 scenepacks',img:'assets/call-of-duty.gif',fb:'assets/141.gif',href:'scenepacks.html#/Call%20of%20Duty',locked:false,g:['#7a4a58','#d9a6b4']},
  {title:'Jon Bernthal',sub:'9 scenepacks',img:'assets/jon-bernthal.gif',fb:'assets/covers/jon.gif',href:'scenepacks.html#/Jon%20Bernthal',locked:false,g:['#4a6a73','#9dbcc5']}
];
const cards=document.getElementById('cards'),stage=document.getElementById('stage');
const lock='<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
packs.forEach((p,idx)=>{
  const a=document.createElement('a');
  a.className='card'+(p.locked?' locked':'');
  a.href=p.href;a.style.setProperty('--i',idx);
  a.setAttribute('aria-label','Scenepack: '+p.title);
  const grad=`<span style="position:absolute;inset:0;background:linear-gradient(160deg,${p.g[0]},${p.g[1]})"></span>`;
  const bg=grad+(p.img?`<img src="${p.img}" alt="" loading="lazy" onerror="${p.fb?`this.onerror=function(){this.remove()};this.src='${p.fb}'`:'this.remove()'}">`:'');
  a.innerHTML=`<i>${bg}<span class="lb"><b>${p.title}</b>${p.sub?`<small>${p.sub}</small>`:''}</span>${p.locked?lock:''}</i>`;
  cards.appendChild(a);
});
/* Masaustunde basmaya gerek yok: uzerine gelince kartlar acilir. Sadece dokunmatik ekranda dokununca acilir. */
document.getElementById('btn').onclick=()=>{if(matchMedia('(hover:none)').matches)stage.classList.toggle('open')};
</script>
</body>
</html>
