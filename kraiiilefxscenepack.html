
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Scenepack — KRAIILEFX</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background: #080808;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 7%;
  border-bottom: 1px solid #222;
  gap: 20px;
}

.logo {
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
}

nav a, .back {
  color: #bbb;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

main {
  flex: 1;
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  padding: 40px 7% 80px;
}

.back {
  display: inline-block;
  margin-bottom: 30px;
}

.detail {
  display: grid;
  grid-template-columns: .9fr 1.1fr;
  gap: 50px;
  align-items: start;
}

.cover {
  width: 100%;
  aspect-ratio: 4 / 5;
  background: #151515;
  border: 1px solid #252525;
  overflow: hidden;
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.content {
  min-width: 0;
}

.eyebrow {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 18px;
}

h1 {
  color: #fff;
  font-size: clamp(38px, 5vw, 60px);
  line-height: 1.05;
  letter-spacing: -1.5px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.subtitle {
  color: #ccc;
  font-size: 14px;
  line-height: 1.8;
  margin-top: 15px;
}

.line {
  height: 1px;
  background: #292929;
  margin: 28px 0;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px 18px;
}

.label {
  color: #999;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.value {
  color: #fff;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.notice {
  margin-top: 30px;
  padding: 18px;
  border: 1px solid #444;
  color: #ddd;
  font-size: 12px;
  line-height: 1.9;
}

.notice strong {
  display: block;
  color: #fff;
  margin-bottom: 5px;
  letter-spacing: 1px;
}

.actions {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}

.button {
  display: block;
  padding: 17px;
  text-align: center;
  background: #f5f5f5;
  color: #080808;
  border: 1px solid #f5f5f5;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.button.secondary {
  background: transparent;
  color: #fff;
  border-color: #444;
}

.message {
  color: #aaa;
  font-size: 14px;
  line-height: 1.8;
  padding: 30px 0;
}

footer {
  display: flex;
  justify-content: space-between;
  padding: 25px 7%;
  border-top: 1px solid #222;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1px;
}

footer a {
  color: #ddd;
}

@media (max-width: 760px) {
  header {
    flex-direction: column;
    padding: 22px 5%;
  }

  nav {
    justify-content: center;
    gap: 15px;
  }

  main {
    padding: 30px 5% 60px;
  }

  .detail {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .cover {
    max-width: 500px;
    margin: auto;
  }

  footer {
    padding: 22px 5%;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="./index.html">KRAIILEFX.</a>

  <nav>
    <a href="./index.html">Home</a>
    <a href="./scenepacks.html">Scenepacks</a>
    <a href="./about.html">About</a>
    <a href="https://www.instagram.com/kraiilefx/"
       target="_blank" rel="noopener noreferrer">Instagram</a>
  </nav>
</header>

<main>
  <a class="back" href="./scenepacks.html">← All Scenepacks</a>

  <div id="page">
    <p class="message">Loading scenepack...</p>
  </div>
</main>

<footer>
  <span>© KRAIILEFX</span>
  <a href="./scenepacks.html">ALL SCENEPACKS ↗</a>
</footer>

<script>
async function loadScenepack() {
  const page = document.getElementById("page");

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get("id") || "SharpStick";

  try {
    const response = await fetch("./data/scenepacks.json");

    if (!response.ok) {
      throw new Error("Could not load scenepacks.json");
    }

    const packs = await response.json();

    const pack = packs.find(item => item.id === requestedId);

    if (!pack) {
      page.innerHTML =
        '<p class="message">Scenepack not found. Please return to the scenepacks page.</p>';
      return;
    }

    document.title = pack.name + " — KRAIILEFX";

    const instagram =
      pack.instagram || "https://www.instagram.com/kraiilefx/";

    const coverPath = pack.cover
      ? "./" + pack.cover.replace(/^\.?\//, "")
      : "";

    page.innerHTML = `
      <section class="detail">
        <div class="cover">
          <img id="packCover" alt="">
        </div>

        <div class="content">
          <div class="eyebrow">SCENEPACK</div>

          <h1 id="packTitle"></h1>

          <p class="subtitle" id="packSubtitle"></p>

          <div class="line"></div>

          <div class="details">
            <div>
              <div class="label">Character</div>
              <div class="value" id="packCharacter"></div>
            </div>

            <div>
              <div class="label">Production</div>
              <div class="value" id="packProduction"></div>
            </div>

            <div>
              <div class="label">Resolution</div>
              <div class="value" id="packResolution"></div>
            </div>

            <div>
              <div class="label">Frame Rate</div>
              <div class="value" id="packFps"></div>
            </div>
          </div>

          <div class="notice">
            <strong>BEFORE DOWNLOADING</strong>
            <span id="packNotice"></span>
          </div>

          <div class="actions">
            <a class="button" id="downloadButton"
               target="_blank" rel="noopener noreferrer">
              Download Scenepack
            </a>

            <a class="button secondary" id="instagramButton"
               target="_blank" rel="noopener noreferrer">
              Follow on Instagram
            </a>
          </div>
        </div>
      </section>
    `;

    document.getElementById("packTitle").textContent = pack.name || "";
    document.getElementById("packCharacter").textContent =
      pack.character || "Not specified";
    document.getElementById("packProduction").textContent =
      pack.production || pack.name || "";
    document.getElementById("packResolution").textContent =
      pack.resolution || "1080p";
    document.getElementById("packFps").textContent =
      pack.fps || "24 FPS";
    document.getElementById("packSubtitle").textContent =
      pack.instructions ||
      "Follow @kraiilefx on Instagram to get the download password.";
    document.getElementById("packNotice").textContent =
      pack.instructions ||
      "Follow @kraiilefx on Instagram to get the download password.";

    const cover = document.getElementById("packCover");

    if (coverPath) {
      cover.src = coverPath;
      cover.alt = (pack.name || "Scenepack") + " cover";
      cover.onerror = () => {
        cover.style.display = "none";
      };
    } else {
      cover.style.display = "none";
    }

    const downloadButton = document.getElementById("downloadButton");

    if (pack.mega) {
      downloadButton.href = pack.mega;
    } else {
      downloadButton.removeAttribute("href");
      downloadButton.textContent = "Download link unavailable";
    }

    document.getElementById("instagramButton").href = instagram;

  } catch (error) {
    console.error(error);
    page.innerHTML =
      '<p class="message">Could not load scenepack information. Check data/scenepacks.json and try again.</p>';
  }
}

loadScenepack();
</script>

</body>
</html>
