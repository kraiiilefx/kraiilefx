<html lang="en">

<title>Scenepack — KRAIILEFX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#f5f5f5;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}

header,footer{display:flex;justify-content:space-between;align-items:center;padding:24px 7%;border-bottom:1px solid #222;gap:20px}

.notice{margin-top:28px;padding:18px;border:1px solid #444;color:#ddd;font-size:12px;line-height:1.9}
.notice strong{display:block;margin-bottom:5px}

<body>
<header>
<a class="logo" href="./index.html">KRAIILEFX.</a>
<nav>
<a href="./index.html">Home</a>

<a href="./about.html">About</a>
<a href="https://www.instagram.com/kraiilefx/" target="_blank" rel="noopener noreferrer">Instagram</a>
</nav>
</header>
<main>
<a class="back" href="./scenepacks.html">← All Scenepacks</a>
<div id="page"><p class="message">Loading scenepack...</p></div>
</main>
<footer><span>© KRAIILEFX</span><a href="./scenepacks.html">ALL SCENEPACKS ↗</a></footer>
<script>
async function loadScenepack(){
 const page=document.getElementById("page");
 const id=new URLSearchParams(location.search).get("id")||"SharpStick";
 try{
  const response=await fetch("./data/scenepacks.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("JSON HTTP "+response.status);
  const packs=await response.json();
  if(!Array.isArray(packs))throw new Error("JSON must be an array");
  const pack=packs.find(p=>String(p.id).trim().toLowerCase()===id.trim().toLowerCase());
  if(!pack){
   page.innerHTML='<p class="message">Scenepack not found: '+id.replace(/[&<>"']/g,"")+'</p>';
   return;
  }
  document.title=(pack.name||"Scenepack")+" — KRAIILEFX";
  page.innerHTML=`
  <section class="detail">
   <div class="cover"><img id="cover" alt=""></div>
   <div>
    <div class="eyebrow">SCENEPACK</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="line"></div>
    <div class="details">
     <div><div class="label">Character</div><div class="value" id="character"></div></div>
     <div><div class="label">Production</div><div class="value" id="production"></div></div>
     <div><div class="label">Resolution</div><div class="value" id="resolution"></div></div>
     <div><div class="label">Frame Rate</div><div class="value" id="fps"></div></div>
    </div>
    <div class="notice"><strong>BEFORE DOWNLOADING</strong><span id="notice"></span></div>
    <div class="actions">
     <a class="button" id="download" target="_blank" rel="noopener noreferrer">Download Scenepack</a>
     <a class="button secondary" id="instagram" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
    </div>
   </div>
  </section>`;
  document.getElementById("title").textContent=pack.name||"";
  document.getElementById("character").textContent=pack.character||"Not specified";
  document.getElementById("production").textContent=pack.production||pack.name||"";
  document.getElementById("resolution").textContent=pack.resolution||"1080p";
  document.getElementById("fps").textContent=pack.fps||"24 FPS";
  document.getElementById("subtitle").textContent=pack.instructions||"Follow @kraiilefx on Instagram to get the download password.";
  document.getElementById("notice").textContent=pack.instructions||"Follow @kraiilefx on Instagram to get the download password.";
  const cover=document.getElementById("cover");
  if(pack.cover){
   cover.src="./"+pack.cover.replace(/^\.?\//,"");
   cover.alt=(pack.name||"Scenepack")+" cover";
   cover.onerror=()=>{cover.style.display="none";};
  }else cover.style.display="none";
  const download=document.getElementById("download");
  if(pack.mega)download.href=pack.mega;
  else{download.removeAttribute("href");download.textContent="Download link unavailable";}
  document.getElementById("instagram").href=pack.instagram||"https://www.instagram.com/kraiilefx/";
 }catch(error){
  console.error(error);
  page.innerHTML='<p class="message">Could not load scenepack information. Check data/scenepacks.json. Error: '+String(error.message).replace(/[&<>"']/g,"")+'</p>';
 }
}
loadScenepack();
</script>
</body>
</html>
