
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRAIILEFX | Scenepack</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 25px 7%;
      border-bottom: 1px solid #252525;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    main {
      width: min(950px, 90%);
      margin: 55px auto;
    }

    .back {
      display: inline-block;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .back:hover { color: white; }

    .details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 38px;
      align-items: start;
    }

    .cover {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #111;
      border: 1px solid #252525;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .eyebrow {
      color: #999;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 12px 0 8px;
      overflow-wrap: anywhere;
    }

    .character {
      color: #aaa;
      margin: 0 0 25px;
    }

    .meta {
      border-top: 1px solid #292929;
      margin: 25px 0;
    }

    .meta div {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #292929;
      font-size: 14px;
    }

    .meta span:first-child { color: #888; }
    .meta span:last-child { text-align: right; }

    .instructions {
      color: #bbb;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 15px 18px;
      margin-top: 12px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .button.secondary {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .error {
      color: #ff8d8d;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    footer {
      border-top: 1px solid #252525;
      text-align: center;
      color: #666;
      padding: 25px;
      margin-top: 65px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 650px) {
      main { margin-top: 30px; }
      .details { grid-template-columns: 1fr; gap: 25px; }
      .cover { max-height: 430px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="./index.html">KRAIILEFX</a>
  </header>

  <main>
    <a class="back" href="./scenepacks.html">← ALL SCENEPACKS</a>
    <div id="page">Loading scenepack...</div>
  </main>

  <footer>KRAIILEFX © 2026</footer>

  <script>
    async function loadScenepack() {
      const page = document.getElementById("page");
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("id") || "SharpStick";

      try {
        const response = await fetch("./data/scenepacks.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not find data/scenepacks.json");
        }

        const packs = await response.json();

        if (!Array.isArray(packs)) {
          throw new Error("Scenepacks data must be a JSON array.");
        }

        const pack = packs.find(item =>
          String(item.id).toLowerCase() === requestedId.toLowerCase()
        );

        if (!pack) {
          throw new Error("Scenepack not found: " + requestedId);
        }

        const cover = pack.cover
          ? `<img src="${pack.cover}" alt="" onerror="this.parentElement.textContent='KRAIILEFX SCENEPACK'">`
          : "";

        const instagram = pack.instagram || "https://www.instagram.com/kraiilefx/";
        const mega = pack.mega || "#";

        page.innerHTML = `
          <section class="details">
            <div class="cover">
              ${cover || "KRAIILEFX SCENEPACK"}
            </div>

            <div>
              <div class="eyebrow">SCENEPACK DOWNLOAD</div>
              <h1>${escapeHTML(pack.name || "Scenepack")}</h1>
              <p class="character">${escapeHTML(pack.character || "")}</p>

              <div class="meta">
                <div><span>Production</span><span>${escapeHTML(pack.production || pack.name || "—")}</span></div>
                <div><span>Character</span><span>${escapeHTML(pack.character || "—")}</span></div>
                <div><span>Resolution</span><span>${escapeHTML(pack.resolution || "—")}</span></div>
                <div><span>FPS</span><span>${escapeHTML(pack.fps || "—")}</span></div>
              </div>

              <p class="instructions">${escapeHTML(pack.instructions || "Follow @kraiilefx on Instagram to get the download password.")}</p>

              <a class="button" href="${escapeAttribute(mega)}" target="_blank" rel="noopener noreferrer">DOWNLOAD SCENEPACK</a>
              <a class="button secondary" href="${escapeAttribute(instagram)}" target="_blank" rel="noopener noreferrer">GET PASSWORD ON INSTAGRAM</a>
            </div>
          </section>
        `;
      } catch (error) {
        page.innerHTML = `
          <h1>Could not load scenepack</h1>
          <p class="error">${escapeHTML(error.message || "Please try again.")}</p>
          <a class="button secondary" href="./scenepacks.html">BACK TO SCENEPACKS</a>
        `;
        console.error(error);
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHTML(value);
    }

    loadScenepack();
  </script>
</body>
</html>
