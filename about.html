
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>About — KRAIILEFX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 6%;
      border-bottom: 1px solid #252525;
    }

    .logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    main {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 90px 8%;
    }

    .eyebrow {
      color: #888;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(55px, 11vw, 130px);
      letter-spacing: -.07em;
      line-height: .9;
    }

    h1 span {
      color: #777;
    }

    .description {
      max-width: 520px;
      margin-top: 30px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.9;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 35px;
    }

    .socials a {
      padding: 15px 20px;
      border: 1px solid #444;
      font-size: 11px;
      letter-spacing: 1.5px;
      transition: background .2s, color .2s;
    }

    .socials a:hover {
      background: white;
      color: black;
    }

    footer {
      padding: 25px 8%;
      border-top: 1px solid #252525;
      color: #777;
      font-size: 11px;
    }

    @media (max-width: 520px) {
      header {
        padding: 22px 5%;
      }

      .logo {
        font-size: 15px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 9px;
      }

      main {
        padding: 70px 6%;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">KRAIILEFX</a>
    <nav aria-label="Main navigation">
      <a href="./">HOME</a>
      <a href="scenepacks.html">SCENEPACKS</a>
      <a class="active" href="about.html">ABOUT</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">A LITTLE ABOUT THIS PROJECT</p>
    <h1>ABOUT<br><span>KRAIILEFX.</span></h1>

    <p class="description">
      KRAIILEFX is a scenepack archive made for editors and creatives.
      Explore the collection, discover new sources, and find the
      materials you need for your next edit.
    </p>

    <div class="socials">
      <a href="scenepacks.html">EXPLORE SCENEPACKS ↗</a>
      <a href="https://www.instagram.com/kraiilefx/"
         target="_blank" rel="noopener noreferrer">
        INSTAGRAM ↗
      </a>
    </div>
  </main>

  <footer>© 2026 KRAIILEFX</footer>
</body>
</html>
