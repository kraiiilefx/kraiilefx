
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>KRAIILEFX — Scenepacks</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      width: 100%;
      padding: 25px 7%;
      border-bottom: 1px solid #242424;
    }

    .logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .hero {
      padding: 75px 20px 55px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(36px, 7vw, 76px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .hero p {
      color: #999;
      margin-top: 17px;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .packs {
      width: 86%;
      max-width: 1200px;
      margin: 0 auto 80px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
    }

    .card {
      display: block;
      min-width: 0;
      background: #101010;
      border: 1px solid #242424;
      transition: transform 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #777;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #171717;
      overflow: hidden;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      color: #777;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .info {
      padding: 20px;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .info p {
      color: #999;
      font-size: 12px;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 10px;
      border: 1px solid #383838;
      color: #ddd;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .empty {
      grid-column: 1 / -1;
      color: #999;
      text-align: center;
      padding: 30px;
    }

    footer {
      padding: 25px;
      text-align: center;
      border-top: 1px solid #242424;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 800px) {
      .packs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 90%;
        gap: 15px;
      }

      .info {
        padding: 14px;
      }
    }

    @media (max-width: 480px) {
      .packs {
        grid-template-columns: 1fr;
        max-width: 360px;
      }

      .hero {
        padding-top: 55px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="./index.html">KRAIILEFX</a>
  </header>

  <section class="hero">
    <h1>SCENEPACKS</h1>
    <p>DOWNLOADS • EDIT</p>
  </section>

  <main class="packs" id="packs">
    <p class="empty">Loading scenepacks...</p>
  </main>

  <footer>KRAIILEFX © 2026</footer>

  <script>
    const packsContainer = document.getElementById("packs");

    async function loadScenepacks() {
      try {
        const response = await fetch("./data/scenepacks.json");

        if (!response.ok) {
          throw new Error("Could not load scenepacks.json");
        }

        const packs = await response.json();
        packsContainer.replaceChildren();

        if (!Array.isArray(packs) || packs.length === 0) {
          packsContainer.innerHTML =
            '<p class="empty">No scenepacks available yet.</p>';
          return;
        }

        packs.forEach((pack) => {
          const card = document.createElement("a");
          card.className = "card";

          const isAccountant =
            pack.id === "Brax" ||
            pack.name === "The Accountant";

          if (isAccountant) {
            card.href = "./braxscenepack.html";
          } else if (pack.id === "SharpStick") {
            card.href =
              "./kraiiilefxscenepack.html?id=SharpStick";
          } else {
            card.href =
              "./kraiiilefxscenepack.html?id=" +
              encodeURIComponent(pack.id || "");
          }

          const cover = document.createElement("div");
          cover.className = "cover";

          if (pack.cover) {
            const img = document.createElement("img");
            img.alt = (pack.name || "Scenepack") + " cover";
            img.loading = "lazy";

            img.onerror = () => {
              cover.replaceChildren();

              const placeholder = document.createElement("div");
              placeholder.className = "cover-placeholder";
              placeholder.textContent = "KRAIILEFX";

              cover.appendChild(placeholder);
            };

            img.src = "./" + pack.cover.replace(/^\.?\//, "");
            cover.appendChild(img);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "cover-placeholder";
            placeholder.textContent = "KRAIILEFX";
            cover.appendChild(placeholder);
          }

          const info = document.createElement("div");
          info.className = "info";

          const title = document.createElement("h2");
          title.textContent = pack.name || "Untitled Scenepack";

          const details = document.createElement("p");
          details.textContent =
            (pack.character || "") +
            (pack.character ? " • " : "") +
            (pack.resolution || "1080p") +
            " • " +
            (pack.fps || "24 FPS");

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "VIEW SCENEPACK →";

          info.append(title, details, tag);
          card.append(cover, info);
          packsContainer.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        packsContainer.innerHTML =
          '<p class="empty">Could not load scenepacks. Please try again.</p>';
      }
    }

    loadScenepacks();
  </script>
</body>
</html>
