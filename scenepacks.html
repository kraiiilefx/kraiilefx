```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Scenepacks — KRAIILEFX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: 'Space Grotesk', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 6%;
      border-bottom: 1px solid #252525;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #999;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
      transition: color .2s;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    main {
      padding: 75px 8% 100px;
      min-height: 75vh;
    }

    .eyebrow {
      color: #888;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 90px);
      letter-spacing: -.06em;
      line-height: .95;
    }

    .subtitle {
      color: #999;
      margin-top: 20px;
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) 190px 190px;
      gap: 12px;
      margin-top: 45px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      background: #111;
      color: #f5f5f5;
      border: 1px solid #333;
      border-radius: 0;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color: #888;
    }

    .results {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid #292929;
      color: #999;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
      margin-top: 28px;
      max-width: 760px;
    }

    .pack {
      display: block;
      min-width: 0;
    }

    .cover {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #161616;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s;
    }

    .pack:hover .cover img {
      transform: scale(1.04);
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(transparent, #000c);
      pointer-events: none;
    }

    .pack-title {
      font-size: 17px;
      margin-top: 13px;
      font-weight: 500;
      letter-spacing: -.5px;
      line-height: 1.35;
    }

    .pack-meta {
      color: #888;
      font-size: 11px;
      margin-top: 7px;
      line-height: 1.7;
    }

    .empty {
      padding: 85px 15px;
      text-align: center;
      color: #999;
    }

    .empty h2 {
      color: #f5f5f5;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 13px;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    footer {
      padding: 25px 8%;
      border-top: 1px solid #252525;
      color: #777;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 760px) {
      main {
        padding: 55px 6% 75px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        margin-top: 35px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 14px;
      }

      header {
        padding: 22px 5%;
      }

      .logo {
        font-size: 15px;
        letter-spacing: 2px;
      }

      nav {
        gap: 13px;
      }

      nav a {
        font-size: 9px;
      }

      .pack-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./">KRAIILEFX</a>

    <nav aria-label="Main navigation">
      <a href="./">HOME</a>
      <a class="active" href="scenepacks.html">SCENEPACKS</a
