<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Scenepacks — KRAIILEFX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    a,
    a:visited {
      color: #f5f5f5;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 6%;
      border-bottom: 1px solid #252525;
    }

    .logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a,
    nav a:visited {
      color: #aaa;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    main {
      padding: 75px 8% 100px;
      min-height: 75vh;
    }

    .eyebrow {
      color: #888;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 90px);
      letter-spacing: -.06em;
      line-height: .95;
    }

    .subtitle {
      color: #999;
      margin-top: 20px;
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) 190px 190px;
      gap: 12px;
      margin-top: 55px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      background: #111;
      color: #f5f5f5;
      border: 1px solid #333;
      border-radius: 0;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color: #888;
    }

    select option {
      background: #111;
      color: #f5f5f5;
    }

    .results {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 35px;
      padding-bottom: 15px;
      border-bottom: 1px solid #292929;
      color: #999;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
      margin-top: 30px;
      max-width: 900px;
    }

    .pack {
      display: block;
      min-width: 0;
    }

    .cover {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: #161616;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .4s;
    }

    .pack:hover .cover img {
      transform: scale(1.04);
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(transparent, #000c);
      pointer-events: none;
    }

    .pack-title {
      color: #f5f5f5;
      font-size: 20px;
      margin-top: 15px;
      font-weight: 500;
      letter-spacing: -.5px;
      line-height: 1.3;
    }

    .pack-meta {
      color: #888;
      font-size: 11px;
      margin-top: 8px;
      line-height: 1.7;
    }

    .empty {
      padding: 85px 15px;
      text-align: center;
      color: #999;
    }

    .empty h2 {
      color: #f5f5f5;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 13px;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    footer {
      padding: 25px 8%;
      border-top: 1px solid #252525;
      color: #777;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 760px) {
      main {
        padding: 55px 6% 75px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        margin-top: 35px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 12px;
      }

      header {
        padding: 22px 5%;
      }

      .logo {
        font-size: 15px;
        letter-spacing: 2px;
      }

      nav {
        gap: 13px;
      }

      nav a {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./">KRAIILEFX</a>

    <nav aria-label="Main navigation">
      <a href="./">HOME</a>
      <a class="active" href="scenepacks.html">SCENEPACKS</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">KRAIILEFX / ARCHIVE</p>
    <h1>SCENEPACKS.</h1>
    <p class="subtitle">Browse the collection.</p>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search scenepacks..."
        aria-label="Search scenepacks"
      >

      <select id="type" aria-label="Filter by production">
        <option value="">All productions</option>
      </select>

      <select id="character" aria-label="Filter by character">
        <option value="">All characters</option>
      </select>
    </div>

    <div class="results">
      <span>COLLECTION</span>
      <span id="count">0 PACKS</span>
    </div>

    <section id="grid" class="grid" aria-label="Scenepacks"></section>

    <section id="empty" class="empty">
      <h2>No scenepacks found.</h2>
      <p>New packs will appear here when they are added to the archive.</p>
    </section>
  </main>

  <footer>© 2026 KRAIILEFX</footer>

  <script>
    const search = document.getElementById("search");
    const typeFilter = document.getElementById("type");
    const characterFilter = document.getElementById("character");
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    let packs = [];

    function addOptions(select, values) {
      const unique = [...new Set(values.filter(Boolean))].sort();

      unique.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const type = typeFilter.value;
      const character = characterFilter.value;

      const filtered = packs.filter(pack => {
        const searchable = [
          pack.name,
          pack.production,
          pack.character
        ].join(" ").toLowerCase();

        return searchable.includes(query)
          && (!type || pack.production === type)
          && (!character || pack.character === character);
      });

      grid.replaceChildren();

      filtered.forEach(pack => {
        const link = document.createElement("a");
        link.className = "pack";
link.href = "kraiiilefxscenepack.html?id=" + encodeURIComponent(pack.id);
        const cover = document.createElement("div");
        cover.className = "cover";

        const img = document.createElement("img");
        img.src = pack.cover;
        img.alt = pack.name + " cover";
        img.loading = "lazy";

        const title = document.createElement("h2");
        title.className = "pack-title";
        title.textContent = pack.name;

        const meta = document.createElement("p");
        meta.className = "pack-meta";
        meta.textContent = [
          pack.production,
          pack.character
        ].filter(Boolean).join(" / ");

        cover.appendChild(img);
        link.append(cover, title, meta);
        grid.appendChild(link);
      });

      count.textContent = filtered.length + " PACKS";
      empty.classList.toggle("hidden", filtered.length > 0);
      grid.classList.toggle("hidden", filtered.length === 0);
    }

    search.addEventListener("input", render);
    typeFilter.addEventListener("change", render);
    characterFilter.addEventListener("change", render);

    fetch("data/scenepacks.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Archive not available");
        }
        return response.json();
      })
      .then(data => {
        packs = data.sort((a, b) =>
          (b.date || "").localeCompare(a.date || "")
        );

        addOptions(typeFilter, packs.map(pack => pack.production));
        addOptions(characterFilter, packs.map(pack => pack.character));
        render();
      })
      .catch(() => {
        packs = [];
        render();
      });
  </script>
</body>
</html>
