<style>
/* Arama kutusundaki beyaz odak çerçevesini kaldır */
.searchbox .search,
.searchbox .search:focus,
.searchbox .search:focus-visible { outline: none !important; box-shadow: none !important; }

/* ===== Kilitli "Coming Soon" kartı ===== */
.card-locked { cursor: pointer; user-select: none; }
.card-locked[hidden] { display: none; }

.card-locked .lock-art {
  position: relative;
  aspect-ratio: 3 / 4;
  display: grid;
  place-items: center;
  padding-bottom: 64px;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.08), rgba(255,255,255,0) 60%),
    #0d0d0d;
}

/* klasör sahnesi */
.card-locked .stage {
  position: relative;
  width: 58%;
  aspect-ratio: 120 / 96;
  perspective: 700px;
  filter: drop-shadow(0 12px 30px rgba(0,0,0,.7));
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}
.card-locked .stage .back {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* klasörden çıkan gifler */
.card-locked .peek {
  position: absolute;
  bottom: 14%;
  left: var(--x, 50%);
  width: 34% !important;
  height: auto !important;
  aspect-ratio: 3 / 4 !important;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.22);
  filter: grayscale(1) brightness(.55);
  transform: translateX(-50%) translateY(0) rotate(0deg);
  transition: transform .65s cubic-bezier(.2,.8,.2,1), filter .5s ease;
}
.card-locked .p1 { --x: 27%; --r: -9deg; }
.card-locked .p2 { --x: 50%; --r: 0deg; z-index: 1; }
.card-locked .p3 { --x: 73%; --r: 9deg; }

/* ön kapak: ana gif */
.card-locked .lid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 80%;
  z-index: 3;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.2);
  background: #151515;
  transform-origin: bottom center;
  transition: transform .65s cubic-bezier(.2,.8,.2,1);
}
.card-locked .lid img {
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  aspect-ratio: auto !important;
  object-fit: cover;
  display: block;
  opacity: .85;
}

/* kilit: hep görünür ve opak */
.card-locked .lock-badge {
  position: absolute;
  z-index: 5;
  top: 58%;
  left: 50%;
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: rgba(18,18,18,.92);
  border: 1px solid rgba(255,255,255,.25);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  transition: transform .4s cubic-bezier(.2,.9,.3,1.3), box-shadow .4s ease;
}

/* hover: klasör açılır, gifler yukarı çıkar */
.card-locked:hover .stage { transform: scale(1.04); }
.card-locked:hover .lid { transform: rotateX(-38deg); }
.card-locked:hover .peek { filter: grayscale(.25) brightness(.95); }
.card-locked:hover .p1 { transform: translateX(-50%) translateY(-52%) rotate(var(--r)); }
.card-locked:hover .p2 { transform: translateX(-50%) translateY(-68%) rotate(var(--r)); }
.card-locked:hover .p3 { transform: translateX(-50%) translateY(-52%) rotate(var(--r)); }
.card-locked:hover .lock-badge {
  transform: rotate(-8deg) scale(1.08);
  box-shadow: 0 0 18px rgba(255,255,255,.3);
}

/* telefonda hover yok: klasör hafif açık dursun */
@media (hover: none) {
  .card-locked .lid { transform: rotateX(-22deg); }
  .card-locked .peek { filter: grayscale(.5) brightness(.8); }
  .card-locked .p1 { transform: translateX(-50%) translateY(-38%) rotate(var(--r)); }
  .card-locked .p2 { transform: translateX(-50%) translateY(-52%) rotate(var(--r)); }
  .card-locked .p3 { transform: translateX(-50%) translateY(-38%) rotate(var(--r)); }
}
</style>

<script>
(function () {
  var modal = document.getElementById('socialsModal');
  var openBtn = document.getElementById('socialsBtn');
  var closeBtn = document.getElementById('socialsClose');
  function open(e) { if (e) e.preventDefault(); modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); }
  function close() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
<script>
/* Kilitli "Coming Soon" klasör kartı: SADECE ana scenepacks listesinde görünür */
(function () {
  var path = location.pathname.replace(/\/+$/, '');
  if (!/(^|\/)scenepacks(\.html)?$/.test(path)) return;

  var grid = document.getElementById('grid');
  var search = document.getElementById('search');
  if (!grid) return;

  var FOLDER_PAGE = 'folder.html';

  /* Ön kapak GIF'i: sırayla bu yolları dener, hangisi varsa onu kullanır */
  var GIF_CANDIDATES = [
    'assets/141.gif',
    'assets/js/141.gif',
    'assets/covers/141.gif',
    'assets/141.GIF'
  ];
  var CHARS = [
    'assets/soap.gif',
    'assets/gaz.gif',
    'assets/ghost.gif'
  ];

  var peeks = CHARS.slice(0, 3).map(function (src, i) {
    return '<img class="peek p' + (i + 1) + '" src="' + src + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">';
  }).join('');

  var locked = document.createElement('a');
  locked.className = 'card card-locked';
  locked.href = FOLDER_PAGE + '?id=CallOfDuty';
  locked.setAttribute('aria-label', 'Call of Duty Scenepacks - Coming Soon');
  locked.style.setProperty('--i', 1);
  locked.innerHTML =
    '<div class="lock-art">' +
      '<div class="stage">' +
        '<svg class="back" viewBox="0 0 120 96" fill="none" aria-hidden="true">' +
          '<path d="M8 20a8 8 0 0 1 8-8h24l10 12h54a8 8 0 0 1 8 8v52a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8V20Z" ' +
          'fill="#161616" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>' +
        '</svg>' +
        peeks +
        '<div class="lid"><img alt=""></div>' +
        '<div class="lock-badge">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<rect x="4" y="11" width="16" height="10" rx="2.5"/>' +
            '<path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>' +
            '<circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/>' +
          '</svg>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="info">' +
      '<div class="t">Coming Soon</div>' +
      '<div class="c">Call of Duty Scenepacks</div>' +
    '</div>';

  /* Ön kapak GIF'ini yükle, bulamazsa sıradaki yolu dene */
  var lidImg = locked.querySelector('.lid img');
  var k = 0;
  lidImg.onerror = function () {
    k++;
    if (k < GIF_CANDIDATES.length) { lidImg.src = GIF_CANDIDATES[k]; }
    else { lidImg.style.visibility = 'hidden'; }
  };
  lidImg.src = GIF_CANDIDATES[0];

  function visible(el) { return el.offsetParent !== null && !el.hidden; }

  function sync() {
    var q = search && search.value.trim();
    var cards = grid.querySelectorAll('.card:not(.card-locked)');
    var folderList = false, packList = false;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (!visible(c)) continue;
      var href = c.getAttribute('href') || '';
      if (/kraiiilefxscenepack/i.test(href)) packList = true;
      if (/\d+\s*scenepacks?/i.test(c.textContent || '')) folderList = true;
    }
    /* Sadece klasör kartlarının göründüğü ana listede göster */
    var hide = !!q || !folderList || packList;
    locked.hidden = hide;
    locked.style.display = hide ? 'none' : '';
    if (grid.lastElementChild !== locked) grid.appendChild(locked);
  }

  /* Sayfa nasıl değişirse değişsin 0.3 sn'de bir kontrol et */
  setInterval(sync, 300);
  if (search) search.addEventListener('input', sync);
  sync();
})();
</script>
