<style>
.socials-modal {
  position: fixed; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.75);
  z-index: 9999;
}
.socials-modal.open { display: flex; }
.socials-box {
  width: min(420px, 90vw);
  background: #0b0b0b;
  color: #fff;
  border: 2px solid #fff;
  border-radius: 14px;
  overflow: hidden;
  font-family: "Instrument Sans", sans-serif;
}
.socials-title {
  position: relative;
  padding: 16px 48px;
  text-align: center;
  border-bottom: 2px solid #fff;
  font-family: "Unbounded", sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
}
.socials-close {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: 0; color: #fff;
  font-size: 26px; line-height: 1; cursor: pointer;
}
.socials-icons {
  display: flex; justify-content: space-around; align-items: center;
  padding: 44px 20px;
}
.socials-icons a { color: #fff; transition: transform .2s, opacity .2s; }
.socials-icons a:hover { transform: scale(1.12); opacity: .8; }

/* Açılış animasyonu */
.socials-modal.open { animation: sm-fade .25s ease both; }
.socials-modal.open .socials-box { animation: sm-pop .4s cubic-bezier(.2,.9,.3,1.2) both; }
.socials-modal.open .socials-icons a { animation: sm-icon .5s cubic-bezier(.2,.9,.3,1.3) both; }
.socials-modal.open .socials-icons a:nth-child(1) { animation-delay: .15s; }
.socials-modal.open .socials-icons a:nth-child(2) { animation-delay: .27s; }

@keyframes sm-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sm-pop {
  from { opacity: 0; transform: translateY(24px) scale(.85); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes sm-icon {
  from { opacity: 0; transform: translateY(14px) scale(.4) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
}

@media (prefers-reduced-motion: reduce) {
  .socials-modal.open,
  .socials-modal.open .socials-box,
  .socials-modal.open .socials-icons a { animation: none; }
}
</style>

<script>
(function () {
  var modal = document.getElementById('socialsModal');
  var openBtn = document.getElementById('socialsBtn');
  var closeBtn = document.getElementById('socialsClose');
  function open(e) { if (e) e.preventDefault(); modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); }
  function close() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
